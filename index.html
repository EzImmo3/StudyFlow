<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Terminale</title>
    <!-- Lien vers le manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- En-tête de l'application -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">StudyFlow</span>
            </a>
            <span class="text-xs bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full font-medium">Mode Hors-ligne Actif</span>
        </div>
    </header>

    <!-- Contenu dynamique géré par le routeur et app.js -->
    <main id="app" class="flex-grow max-w-6xl w-full mx-auto">
        <!-- Les matières et chapitres s'injecteront ici -->
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        <p>StudyFlow &copy; 2026-2027 — Votre compagnon de révision pour le Bac</p>
    </footer>

    <!-- Script principal en tant que module ES6 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
